baseURL: https://rich-junwang.github.io/ # 绑定的域名
languageCode: 'en-us' # en-us
title: Jun's Blog
theme: hugo-PaperMod  # 主题名字，和themes文件夹下的一致

enableInlineShortcodes: true
enableEmoji: true # 允许使用 Emoji 表情，建议 true
enableRobotsTXT: true # 允许爬虫抓取到搜索引擎，建议 true
hasCJKLanguage: true # 自动检测是否包含 中文日文韩文 如果文章中使用了很多中文引号的话可以开启

buildDrafts: false
buildFuture: false
buildExpired: false

googleAnalytics:  # 谷歌统计
# Copyright: Jun

pagination:
  pagerSize: 15
summaryLength: 140 # 文章概览的自字数，默认70

minify:
  disableXML: true
  # minifyOutput: true

permalinks: # 访问博客时网址的显示形式
  post: "/:title/"
  # post: "/:year/:month/:day/:title/"

defaultContentLanguage: en-us # 最顶部首先展示的语言页面
defaultContentLanguageInSubdir: true

menu:
  main:
    - identifier: home
      name: 🏠 Home
      url: /
      weight: 1
    - identifier: about
      name: 🙋🏻‍♂️ About
      url: about
      weight: 2
    - identifier: posts
      name: 📚 Posts
      url: posts
      weight: 3
    - identifier: archives
      name: ⏱️ Archives
      url: archives/
      weight: 20
    - identifier: search
      name: 🔍 Search
      url: search
      weight: 50
    - identifier: tags
      name: 🧩 Tags
      url: tags
      weight: 15
outputs:
  home:
    - HTML
    - RSS
    - JSON

# 这里的参数会被代码以 .Site.Params 的形式读取
params:
  env: production # to enable google analytics, opengraph, twitter-cards and schema.
  description: ""
  author: Jun
  # author: ["Me", "You"] # multiple authors

  defaultTheme: light  # defaultTheme: light or  dark
  disableThemeToggle: false
  DateFormat: "2006-01-02"
  ShowShareButtons: true
  ShowReadingTime: true
  # disableSpecialistPost: true
  displayFullLangName: true
  ShowPostNavLinks: true
  ShowBreadCrumbs: true
  ShowCodeCopyButtons: true
  hideFooter: false # 隐藏页脚
  ShowWordCounts: true
  VisitCount: true
  ShowLastMod: true #显示文章更新时间

  ShowToc: true # 显示目录
  TocOpen: true # 自动展开目录

  extendCodeBackground: false # 代码块是否自动横向展开

  comments: true

  profileMode:
    enabled: true
    title: Jun Wang
    subtitle:
    # subtitle: "🧨学而时习之，不亦说乎？有朋自远方来，不亦乐乎？<br/>👇联系方式"
    imageUrl: "img/Q.gif"
    imageTitle:
    imageWidth: 150
    imageHeight: 150
    buttons:
      - name: 👨🏻‍💻 Tech
        url: posts/tech
      - name: 📕 Read
        url: posts/read
      # - name: 🏖 Life
      #   url: posts/life

  socialIcons:
    - name: googlescholar
      url: https://scholar.google.com/citations?user=ct92MO4AAAAJ&hl=en
    - name: email
      url: "mailto:richard.{first_name}{last_name}@gmail.com"
    - name: RSS
      url: "index.xml"

  label: # 左上角图标
    text: "Jun's Blog"
    icon: "img/Q.gif"
    iconHeight: 35

  analytics:
    google:
      SiteVerificationTag: ""

  assets:
    favicon: "img/Q.gif"
    favicon16x16: "img/Q.gif"
    favicon32x32: "img/Q.gif"
    apple_touch_icon: "img/Q.gif"
    safari_pinned_tab: "img/Q.gif"
    disableFingerprinting: true # 禁用指纹

  cover:
    hidden: false # hide everywhere but not in structured data
    hiddenInList: false # hide on list pages and home
    hiddenInSingle: false # hide on single page

  fuseOpts: # 搜索配置
    isCaseSensitive: false
    shouldSort: true
    location: 0
    distance: 1000
    threshold: 0.4
    minMatchCharLength: 0
    keys: [ "title", "permalink", "summary" ]

  StartYear: 2020 # 底部开始年份
  PublicSecurityIconLink: # 填自己的公安图标链接,可用绝对路径，相对路径如 img/beian.png
  PublicNetworkSecurity: # 底部公网安备号

  Reward: false #打赏是否开启
  # 打赏微信图片地址，
  # 可用绝对和相对地址，相对地址的图片需放在static/img下，
  # 填写格式为img/wechat_pay.png
  WechatPay: 
  Alipay:  #打赏支付宝图片地址

  # Giscus comments (GitHub Discussions). Get repoId / categoryId from https://giscus.app
  giscus:
    repo: rich-junwang/rich-junwang.github.io
    repoId: MDEwOlJlcG9zaXRvcnkxOTU2MDUyMzk=
    category: Announcements
    categoryId: DIC_kwDOC6iy984DLBpo

taxonomies:
  category: categories
  tag: tags
  series: series

markup:
  goldmark:
    extensions:
      passthrough: # leave math untouched by Markdown so KaTeX receives raw LaTeX
        enable: true
        delimiters:
          block: [['$$', '$$'], ['\[', '\]']]
          inline: [['$', '$'], ['\(', '\)']]
    renderer:
      unsafe: true # HUGO 默认转义 Markdown 文件中的 HTML 代码，如需开启的话
  highlight:
    # anchorLineNos: true
    codeFences: true
    guessSyntax: true
    # lineNos: true
    noClasses: true
    tabWidth: 4
    style: monokai
    # codeFences：代码围栏功能，这个功能一般都要设为 true 的，不然很难看，就是干巴巴的-代码文字，没有颜色。
    # guessSyntax：猜测语法，这个功能建议设置为 true, 如果你没有设置要显示的语言则会自动匹配。
    # hl_Lines：高亮的行号，一般这个不设置，因为每个代码块我们可能希望让高亮的地方不一样。
    # lineNoStart：行号从编号几开始，一般从 1 开始。
    # lineNos：是否显示行号，我比较喜欢显示，所以我设置的为 true.
    # lineNumbersInTable：使用表来格式化行号和代码,而不是 标签。这个属性一般设置为 true.
    # noClasses：使用 class 标签，而不是内嵌的内联样式

privacy:
  vimeo:
    disabled: false
    simple: true

  twitter:
    disabled: false
    enableDNT: true
    simple: true

  instagram:
    disabled: false
    simple: true

  youtube:
    disabled: false
    privacyEnhanced: true

services:
  instagram:
    disableInlineCSS: true
  twitter:
    disableInlineCSS: true
